name: Build APK

# Every push builds an installable APK and publishes it to Releases, so the phone only ever needs
# the Releases page -- no Android Studio, no unzipping, no GitHub login.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use the release keystore from secrets, if one is configured
        # Optional. With no secret set, the build uses the keystore committed at
        # signing/cycle-follower.jks, which keeps the signature identical across builds so a new
        # APK installs straight over an old one instead of failing.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/cycle-follower.jks
            echo "Signing with the keystore from repository secrets."
          else
            echo "No KEYSTORE_BASE64 secret set; signing with the committed keystore."
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          NAME="CycleFollower-${VERSION}-build${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Keep the APK on the workflow run too
        uses: actions/upload-artifact@v4
        with:
          name: cycle-follower-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -euo pipefail

          BRANCH="$GITHUB_REF_NAME"
          if [ "$BRANCH" = "main" ]; then
            TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
            TITLE="Cycle Follower ${VERSION} (build ${GITHUB_RUN_NUMBER})"
            PRERELEASE=""
          else
            # One rolling release per branch, recreated on each push, so the link never changes.
            TAG="dev-$(echo "$BRANCH" | tr '/' '-')"
            TITLE="Cycle Follower - ${BRANCH} (build ${GITHUB_RUN_NUMBER})"
            PRERELEASE="--prerelease"
          fi

          # Make re-runs idempotent rather than failing on an existing tag.
          gh release delete "$TAG" --yes --cleanup-tag || true

          {
            echo "Installable APK built from \`${GITHUB_SHA}\` on \`${BRANCH}\`."
            echo
            echo "**To install it on your phone**"
            echo
            echo "1. Open this page on the phone and tap the \`.apk\` file below."
            echo "2. Android will ask whether to allow installs from your browser. Allow it, then tap Install."
            echo "3. Open Cycle Follower and answer the eight setup questions."
            echo
            echo "Every build is signed with the same key, so a newer build installs straight over an older one."
            echo "The app is not on Google Play, needs no account, and has no internet permission at all."
          } > release-notes.md

          gh release create "$TAG" "dist/${APK}" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE
